basePath: /api/v1
definitions:
  dto.AdditionalCostCalcItem:
    properties:
      cost:
        type: number
      title:
        type: string
    type: object
  dto.AdditionalCostItem:
    properties:
      cost:
        type: number
      title:
        type: string
    required:
    - cost
    - title
    type: object
  dto.AdminResetPasswordRequest:
    properties:
      password:
        type: string
    required:
    - password
    type: object
  dto.AdminUpdateUserRequest:
    properties:
      clientId:
        type: integer
      contactNumber:
        type: string
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      userLevel:
        type: integer
      username:
        type: string
    type: object
  dto.BulkImportFarmItem:
    properties:
      name:
        maxLength: 100
        type: string
      ponds:
        items:
          $ref: '#/definitions/dto.BulkImportPondItem'
        minItems: 1
        type: array
    required:
    - name
    - ponds
    type: object
  dto.BulkImportFarmPondRequest:
    properties:
      farms:
        items:
          $ref: '#/definitions/dto.BulkImportFarmItem'
        maxItems: 1000
        minItems: 1
        type: array
    required:
    - farms
    type: object
  dto.BulkImportFarmPondResponse:
    properties:
      farms:
        items:
          $ref: '#/definitions/dto.BulkImportFarmResult'
        type: array
      farmsCreated:
        type: integer
      farmsExisting:
        type: integer
      pondsCreated:
        type: integer
      pondsUnchanged:
        type: integer
      pondsUpdated:
        type: integer
    type: object
  dto.BulkImportFarmResult:
    properties:
      isNew:
        type: boolean
      name:
        type: string
      pondsCreated:
        type: integer
      pondsUnchanged:
        type: integer
      pondsUpdated:
        type: integer
    type: object
  dto.BulkImportPondItem:
    properties:
      area:
        type: number
      name:
        maxLength: 100
        type: string
    required:
    - name
    type: object
  dto.ChangePasswordRequest:
    properties:
      currentPassword:
        type: string
      newPassword:
        type: string
    required:
    - currentPassword
    - newPassword
    type: object
  dto.CreateClientRequest:
    properties:
      contactNumber:
        type: string
      name:
        type: string
      ownerName:
        type: string
    required:
    - contactNumber
    - name
    - ownerName
    type: object
  dto.CreateFarmRequest:
    properties:
      clientId:
        type: integer
      name:
        type: string
    required:
    - clientId
    - name
    type: object
  dto.CreateFeedCollectionRequest:
    properties:
      clientId:
        description: when JWT has no clientId (e.g. super admin), required for create
        type: integer
      fcr:
        type: number
      feedPriceHistories:
        items:
          $ref: '#/definitions/dto.CreateFeedPriceHistoryItemRequest'
        type: array
      feedType:
        enum:
        - fresh
        - pellet
        type: string
      name:
        type: string
      packSizeKg:
        type: number
      supplier:
        type: string
      unit:
        type: string
    required:
    - name
    - unit
    type: object
  dto.CreateFeedPriceHistoryItemRequest:
    properties:
      price:
        type: number
      pricePerKg:
        type: number
      priceUpdatedDate:
        type: string
    required:
    - price
    - priceUpdatedDate
    type: object
  dto.CreateMerchantRequest:
    properties:
      clientId:
        description: |-
          ClientId is used only by super admins (no client in token) to target a
          client. Normal users' client is taken from the JWT and this is ignored.
        type: integer
      contactNumber:
        type: string
      location:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  dto.CreatePondItem:
    properties:
      area:
        type: number
      name:
        type: string
    required:
    - name
    type: object
  dto.CreatePondsRequest:
    properties:
      farmId:
        type: integer
      ponds:
        items:
          $ref: '#/definitions/dto.CreatePondItem'
        minItems: 1
        type: array
    required:
    - farmId
    - ponds
    type: object
  dto.CreateUserRequest:
    properties:
      clientId:
        type: integer
      contactNumber:
        type: string
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      password:
        type: string
      userLevel:
        type: integer
      username:
        type: string
    required:
    - firstName
    - password
    - username
    type: object
  dto.DailyLogBulkUpsertRequest:
    properties:
      deleteDays:
        items:
          type: integer
        type: array
      entries:
        items:
          $ref: '#/definitions/dto.DailyLogEntryInput'
        type: array
      freshFeedCollectionId:
        type: integer
      month:
        description: YYYY-MM
        type: string
      pelletFeedCollectionId:
        type: integer
    required:
    - month
    type: object
  dto.DailyLogEntryInput:
    properties:
      day:
        maximum: 31
        minimum: 1
        type: integer
      deathFishCount:
        minimum: 0
        type: integer
      fresh:
        type: number
      pelletEvening:
        type: number
      pelletMorning:
        type: number
      touristCatchCount:
        minimum: 0
        type: integer
    required:
    - day
    type: object
  dto.DailyLogEntryResponse:
    properties:
      day:
        type: integer
      deathFishCount:
        type: integer
      fresh:
        type: number
      freshUnitPrice:
        type: number
      id:
        type: integer
      pelletEvening:
        type: number
      pelletMorning:
        type: number
      pelletUnitPrice:
        type: number
      touristCatchCount:
        type: integer
    type: object
  dto.DailyLogMonthResponse:
    properties:
      entries:
        items:
          $ref: '#/definitions/dto.DailyLogEntryResponse'
        type: array
      freshFeedCollectionId:
        type: integer
      freshFeedCollectionName:
        type: string
      freshUnit:
        type: string
      pelletFeedCollectionId:
        type: integer
      pelletFeedCollectionName:
        type: string
      pelletUnit:
        type: string
    type: object
  dto.DailyLogTemplateImportResponse:
    properties:
      results:
        items:
          $ref: '#/definitions/dto.DailyLogTemplateImportResult'
        type: array
      skipped:
        items:
          type: string
        type: array
    type: object
  dto.DailyLogTemplateImportResult:
    properties:
      pondId:
        type: integer
      pondName:
        type: string
      rowsImported:
        type: integer
    type: object
  dto.LoginRequest:
    properties:
      password:
        type: string
      rememberMe:
        type: boolean
      username:
        type: string
    required:
    - password
    - username
    type: object
  dto.PondCycleResponse:
    properties:
      endDate:
        type: string
      feedCost:
        type: number
      fishTypes:
        items:
          type: string
        type: array
      id:
        type: integer
      isActive:
        type: boolean
      netResult:
        type: number
      startDate:
        type: string
      totalCost:
        type: number
      totalFish:
        type: integer
      totalRevenue:
        type: number
    type: object
  dto.PondFillCalcRequest:
    properties:
      additionalCosts:
        items:
          $ref: '#/definitions/dto.AdditionalCostCalcItem'
        type: array
      amount:
        minimum: 0
        type: integer
      fishWeight:
        type: number
      pricePerUnit:
        type: number
    type: object
  dto.PondFillRequest:
    properties:
      activityDate:
        type: string
      additionalCosts:
        items:
          $ref: '#/definitions/dto.AdditionalCostItem'
        type: array
      amount:
        minimum: 1
        type: integer
      fishType:
        type: string
      fishWeight:
        description: |-
          FishWeight (avg kg/fish) is required: fill cost = amount × fishWeight ×
          pricePerUnit, so a missing weight would silently book a zero stock cost.
        type: number
      pricePerUnit:
        type: number
      remark:
        type: string
    required:
    - activityDate
    - amount
    - fishType
    - fishWeight
    - pricePerUnit
    type: object
  dto.PondMoveCalcRequest:
    properties:
      additionalCosts:
        items:
          $ref: '#/definitions/dto.AdditionalCostCalcItem'
        type: array
      amount:
        minimum: 0
        type: integer
      fishWeight:
        type: number
      pricePerUnit:
        type: number
    type: object
  dto.PondMoveRequest:
    properties:
      activityDate:
        type: string
      additionalCosts:
        items:
          $ref: '#/definitions/dto.AdditionalCostItem'
        type: array
      amount:
        minimum: 1
        type: integer
      fishType:
        type: string
      fishWeight:
        type: number
      markToClose:
        type: boolean
      pricePerUnit:
        type: number
      remark:
        type: string
      toPondId:
        type: integer
    required:
    - activityDate
    - amount
    - fishType
    - fishWeight
    - pricePerUnit
    - toPondId
    type: object
  dto.PondResponse:
    properties:
      ageDays:
        type: integer
      area:
        type: number
      createdAt:
        type: string
      createdBy:
        type: string
      farmId:
        type: integer
      feedCost:
        type: number
      fishTypes:
        items:
          type: string
        type: array
      id:
        type: integer
      latestActivityDate:
        type: string
      latestActivityType:
        type: string
      name:
        type: string
      netResult:
        type: number
      startDate:
        type: string
      status:
        type: string
      totalCost:
        description: |-
          Cycle P&L for the currently-active cycle (nil when the pond has none).
          TotalCost/TotalRevenue are the accumulated transactional figures;
          FeedCost is derived live from daily logs + feed price history; NetResult
          = TotalRevenue − TotalCost − FeedCost.
        type: number
      totalFish:
        type: integer
      totalRevenue:
        type: number
      updatedAt:
        type: string
      updatedBy:
        type: string
    type: object
  dto.PondSellCalcDetailItem:
    properties:
      fishCount:
        type: integer
      fishSizeGradeId:
        type: integer
      pricePerUnit:
        type: number
      weight:
        type: number
    type: object
  dto.PondSellCalcRequest:
    properties:
      additionalCosts:
        items:
          $ref: '#/definitions/dto.AdditionalCostCalcItem'
        type: array
      details:
        items:
          $ref: '#/definitions/dto.PondSellCalcDetailItem'
        type: array
    type: object
  dto.PondSellDetailItem:
    properties:
      fishCount:
        description: |-
          FishCount is required: the active pond tracks stock by head count, so every
          sold line must state how many fish it removes to keep total_fish accurate.
        minimum: 1
        type: integer
      fishSizeGradeId:
        type: integer
      pricePerUnit:
        type: number
      weight:
        type: number
    required:
    - fishCount
    - fishSizeGradeId
    - pricePerUnit
    - weight
    type: object
  dto.PondSellRequest:
    properties:
      activityDate:
        type: string
      additionalCosts:
        items:
          $ref: '#/definitions/dto.AdditionalCostItem'
        type: array
      details:
        items:
          $ref: '#/definitions/dto.PondSellDetailItem'
        minItems: 1
        type: array
      markToClose:
        type: boolean
      merchantId:
        type: integer
    required:
    - activityDate
    - details
    type: object
  dto.RegisterRequest:
    properties:
      clientId:
        type: integer
      contactNumber:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      password:
        type: string
      userLevel:
        type: integer
      username:
        type: string
    required:
    - clientId
    - firstName
    - password
    - username
    type: object
  dto.UpdateFarmBody:
    properties:
      name:
        type: string
    type: object
  dto.UpdateFeedCollectionRequest:
    properties:
      fcr:
        type: number
      feedType:
        enum:
        - fresh
        - pellet
        type: string
      id:
        type: integer
      name:
        type: string
      packSizeKg:
        type: number
      supplier:
        type: string
      unit:
        type: string
    required:
    - id
    type: object
  dto.UpdateMerchantRequest:
    properties:
      contactNumber:
        type: string
      id:
        type: integer
      location:
        type: string
      name:
        type: string
    required:
    - id
    type: object
  dto.UpdatePondBody:
    properties:
      area:
        type: number
      farmId:
        type: integer
      name:
        type: string
      status:
        enum:
        - active
        - maintenance
        type: string
    type: object
  dto.UpdateUserRequest:
    properties:
      contactNumber:
        type: string
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      username:
        type: string
    type: object
  http.ErrorResponseModel:
    properties:
      code:
        example: "500010"
        type: string
      details:
        example: freshFeedCollectionId is required
        type: string
      fields:
        items:
          $ref: '#/definitions/http.FieldError'
        type: array
      message:
        example: Validation failed
        type: string
      request_id:
        example: 01HXYZ123ABC
        type: string
    type: object
  http.FieldError:
    properties:
      field:
        example: freshFeedCollectionId
        type: string
      message:
        example: is required
        type: string
      tag:
        example: required
        type: string
      value:
        type: string
    type: object
  http.ResponseModel:
    properties:
      data: {}
      error: {}
      result:
        type: boolean
    type: object
  model.Client:
    properties:
      contactNumber:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      id:
        type: integer
      isActive:
        type: boolean
      isTouristFishingEnabled:
        type: boolean
      name:
        type: string
      ownerName:
        type: string
      updated_at:
        type: string
      updated_by:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: A Boonma Farm application with Fiber, GORM, and Dependency Injection
  title: Boonma Farm API
  version: "1.0"
paths:
  /activity:
    get:
      consumes:
      - application/json
      description: Newest discrete events (fill/move/sell) across all of the client's
        ponds, ordered by activity date desc. Daily-log saves are not included. Optional
        ?limit caps the row count (omit or 0 for the full history). To page, pass
        beforeDate + beforeId from the last row of the previous page; the response
        is a plain array, so a page shorter than ?limit means the end.
      parameters:
      - description: Max rows to return; 0 or omitted = all
        in: query
        name: limit
        type: integer
      - description: 'Cursor: activityDate of the last row already seen (YYYY-MM-DD
          or RFC3339). Requires beforeId.'
        in: query
        name: beforeDate
        type: string
      - description: 'Cursor: id of the last row already seen. Requires beforeDate.'
        in: query
        name: beforeId
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ResponseModel'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponseModel'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponseModel'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/http.ErrorResponseModel'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponseModel'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Get the activity feed
      tags:
      - activity
  /activity/{activityId}/sell-details:
    get:
      consumes:
      - application/json
      description: Size-grade lines for one sell activity (weight, ฿/kg, head count
        and line total per grade), smallest grade first. Returns an empty list when
        the activity is not a sell, does not exist, or belongs to another client.
      parameters:
      - description: Sell activity id
        in: path
        name: activityId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ResponseModel'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponseModel'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponseModel'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponseModel'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Get a sale's size-grade breakdown
      tags:
      - activity
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login user with provided credentials and return JWT token. Token
        is also set as HTTP-only cookie.
      parameters:
      - description: Login data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ResponseModel'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponseModel'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponseModel'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponseModel'
      summary: Login user
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Logout user and clear the authentication cookie
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ResponseModel'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponseModel'
      summary: Logout user
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user with the provided details
      parameters:
      - description: User data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ResponseModel'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponseModel'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponseModel'
      summary: Register a new user
      tags:
      - auth
  /client:
    post:
      consumes:
      - application/json
      description: Add a new client with the provided details. Only super admin can
        create clients.
      parameters:
      - description: Client data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateClientRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ResponseModel'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponseModel'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponseModel'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponseModel'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Add a new client
      tags:
      - client
    put:
      consumes:
      - application/json
      description: Update details of a client. Super admin can update any client,
        others can only update their own client.
      parameters:
      - description: Client data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.Client'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ResponseModel'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponseModel'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponseModel'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrorResponseModel'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponseModel'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Update client
      tags:
      - client
  /client/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve a client by its ID. Super admin can access any client,
        others can only access their own client.
      parameters:
      - description: Client ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ResponseModel'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponseModel'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponseModel'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrorResponseModel'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponseModel'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Get a client by ID
      tags:
      - client
  /client/list:
    get:
      consumes:
      - application/json
      description: Returns a list of clients with id and name for dropdown/select.
        Only super admin can access.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ResponseModel'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponseModel'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponseModel'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Get client list for dropdown
      tags:
      - client
  /client/summaries:
    get:
      consumes:
      - application/json
      description: Returns each client with farmCount, pondCount, userCount. Super
        admin only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ResponseModel'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponseModel'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponseModel'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Get client summaries
      tags:
      - client
  /farm:
    get:
      consumes:
      - application/json
      description: Retrieve a list of farms associated with the current client
      parameters:
      - description: Client ID
        in: query
        name: clientId
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ResponseModel'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponseModel'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponseModel'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Get list of farms
      tags:
      - farm
    post:
      consumes:
      - application/json
      description: Add a new farm entry with the provided details. Requires client-admin
